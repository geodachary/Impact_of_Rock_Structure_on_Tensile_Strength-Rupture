[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foliated-rock-brazilian-test"
version = "1.0.0"
description = "Orthotropic stress analysis and four-mechanism failure classification for Brazilian tensile tests on foliated rocks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["rock mechanics", "Brazilian test", "anisotropy", "foliation", "fracture"]

# Versions below are the ones this workflow was actually executed and tested with.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "shapely>=2.0",
    "joblib>=1.3",
    "statsmodels>=0.14",
    "openpyxl>=3.1",          # the metric export writes a formatted workbook
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
notebook = ["jupyter", "nbconvert>=7.0", "nbformat>=5.9", "nbclient>=0.9", "ipykernel"]

[project.scripts]
reproduce-all = "scripts.reproduce_all:main"

[tool.setuptools]
# Subpackages must be listed explicitly: a flat `packages` list is not
# recursive, so tools.ddm and tools.analysis would be absent from an install.
packages = ["tools", "tools.ddm", "tools.analysis"]

[tool.setuptools.package-data]
tools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: long-running test (notebook execution)",
]
